name: CI — Agente Navegador

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes e Validação
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Validar importação do pacote
        run: |
          python -c "import agente_navegador; print(f'Versão: {agente_navegador.__version__}')"
          python -c "from agente_navegador.models import Plan, PlanStep, ActionType; print('Models OK')"
          python -c "from agente_navegador.safety import validate_plan_safety; print('Safety OK')"
          python -c "from agente_navegador.collectors import load_plan, validate_plan; print('Collectors OK')"
          python -c "from agente_navegador.config import config; print(f'Config OK — Empresa: {config.company_name}')"

      - name: Rodar testes (pytest)
        run: |
          pytest -v --tb=short

      - name: Validar planos YAML do projeto
        run: |
          python -m agente_navegador.cli validate plans/meta_whatsapp_setup.yaml
          python -m agente_navegador.cli validate plans/instagram_setup.yaml
          python -m agente_navegador.cli validate plans/facebook_page_setup.yaml
          python -m agente_navegador.cli validate plans/tiktok_developers_setup.yaml

  lint:
    name: Linting (opcional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check agente_navegador/ --select=E,W,F --ignore=E501
