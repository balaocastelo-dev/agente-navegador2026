name: whatsapp_web_auto_reply
description: "Agente auto-responder para WhatsApp Web via QR Code (Balao da Informatica Castelo)"
version: "1.0"
steps:
  - action: goto
    url: https://web.whatsapp.com/

  - action: whatsapp_web_responder
    value: "Ola! Sou o assistente virtual de vendas do Balao da Informatica Castelo. (Auto-reply)"
    save_as: total_respondidas
    extra:
      require_confirmation: false # Mantenha false para responder automaticamente sem bloquear o terminal do servidor
      max_cycles: 100
      cycle_delay_sec: 5
